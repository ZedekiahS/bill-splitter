<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=bill-splitter-1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bill-splitter-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24594d">
  <title>Bill Splitter · 一起记，轻松分</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-aside">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">b.</span><span>Bill Splitter<small data-i18n="一起记，轻松分。">一起记，轻松分。</small></span></a>
      <div><h1><span data-i18n="和朋友，">和朋友，</span><br><span data-i18n="把每笔小账记清。">把每笔小账记清。</span></h1><p><span data-i18n="一次旅行、一顿聚餐、一屋子的日常。">一次旅行、一顿聚餐、一屋子的日常。</span><br><span data-i18n="记录共同开销，看清每个人的份额，慢慢结清。">记录共同开销，看清每个人的份额，慢慢结清。</span></p></div>
      <div><a class="button secondary" href="app.html?demo=1" data-i18n="先试着记一笔 →">先试着记一笔 →</a><p class="form-hint" data-i18n="无需注册，先试试一起记账。">无需注册，先试试一起记账。</p></div>
    </section>
    <section id="loginPage" class="login-panel">
      <div class="login-language"><select id="language-picker" class="language-picker" aria-label="Language"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></div>
      <div class="login-form"><h2 data-i18n="欢迎回来">欢迎回来</h2><p class="muted" data-i18n="登录后，继续你们共同的账本。">登录后，继续你们共同的账本。</p>
        <form id="emailLoginForm">
          <label id="signup-name" class="form-field" hidden><span class="field-label" data-i18n="你的称呼">你的称呼</span><input class="form-input" name="displayName" autocomplete="nickname" maxlength="40"></label>
          <label class="form-field"><span class="field-label" data-i18n="邮箱">邮箱</span><input class="form-input" type="email" id="inputEmail" name="email" autocomplete="username" placeholder="you@example.com" required></label>
          <label class="form-field"><span class="field-label" data-i18n="密码">密码</span><input class="form-input" type="password" id="inputPassword" name="password" minlength="10" maxlength="128" autocomplete="current-password" required></label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button id="loginButton" type="submit" class="button primary full-width" data-i18n="登录并继续">登录并继续</button>
        </form>
        <button id="signupButton" type="button" class="button quiet full-width" data-i18n="注册新账号">注册新账号</button>

      </div>
    </section>
  </main>
  <script type="module" src="scripts/login.mjs"></script>
</body>
</html>
