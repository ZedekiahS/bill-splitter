<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons">
  <link rel="stylesheet" href="styles/bootstrap-material-design.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <title>Bill Splitter - Login</title>
</head>

<body>
  <nav class="navbar navbar-dark fixed-top">
    <a class="navbar-brand" href="#">Bill Splitter</a>
  </nav>
  <div id="loginPage" class="container page-container text-center">
    <h3 class="mb-4">Welcome</h3>

    <div class="form-group">
      <input type="email" class="form-control" id="inputEmail" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" class="form-control" id="inputPassword" placeholder="Password">
    </div>
    <button id="loginButton" class="btn btn-primary btn-block">Log In with Email</button>
    <button id="signupButton" class="btn btn-secondary btn-block">Sign Up with Email</button>

    <div class="form-group mt-4">
      <input type="text" class="form-control" id="phoneNumber" placeholder="Phone number with country code">
    </div>
    <div id="recaptcha-container"></div>
    <button id="phoneButton" class="btn btn-info btn-block">Sign In with Phone</button>

    <button id="guestButton" class="btn btn-dark btn-block mt-4">Continue as Guest</button>

    <hr>
    <button id="rosefireButton" type="button" class="btn btn-danger btn-outline">
      <i class="material-icons">school</i> Sign in with Rosefire
    </button>
  </div>


  </div>
  <script src="scripts/jquery.min.js"></script>
  <script src="scripts/popper.js"></script>
  <script src="scripts/bootstrap-material-design.js"></script>
  <script>$("body").bootstrapMaterialDesign();</script>
  <script src="/__/firebase/7.18.0/firebase-app.js"></script>
  <script src="/__/firebase/7.18.0/firebase-analytics.js"></script>
  <script src="/__/firebase/7.18.0/firebase-auth.js"></script>
  <script src="/__/firebase/7.18.0/firebase-firestore.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="scripts/rosefire.min.js"></script>
  <script src="scripts/main.js"></script>
</body>

</html>
