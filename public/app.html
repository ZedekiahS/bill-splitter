<!doctype html>

  <meta charset="utf-8">

<body>
  <a class="skip-link" href="#main-content" data-i18n="跳到主要内容">跳到主要内容</a>

    <aside class="sidebar" aria-label="主导航" data-i18n-aria-label="主导航">
      <a class="brand" href="app.html"><span class="brand-mark" aria-hidden="true">b.</span><span>Bill Splitter<small data-i18n="一起记，轻松分。">一起记，轻松分。</small></span></a>

    </aside>
    <div class="workspace">
