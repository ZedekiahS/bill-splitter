<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=bill-splitter-1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bill-splitter-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons">
  <link rel="stylesheet" href="styles/bootstrap-material-design.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <title>Bill Splitter - History</title>
</head>

<body>
    <nav class="navbar navbar-dark fixed-top w-100 d-flex align-items-center">
    <div class="dropdown">
        <button class="btn text-light dropdown-toggle" type="button" id="hamburger" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="material-icons">menu</i>
        </button>
        <div class="dropdown-menu" aria-labelledby="hamburger">
        <a class="dropdown-item" href="/home.html">Home</a>
        <a class="dropdown-item active" href="/history.html">Payment History</a>
        <a class="dropdown-item" href="/unpaid.html">Unpaid Bill</a>
        <div class="dropdown-divider"></div>
        <button id="menuSignOut" class="dropdown-item">Sign out</button>
        </div>
    </div>
    <a class="navbar-brand ml-2" href="/home.html">Bill History</a>

    <button id="navBtnCalendar" class="btn text-light ml-auto" title="Filter by dates">
        <i class="material-icons">calendar_today</i>
    </button>
    </nav>


  <div id="historyPage" class="container page-container">
    <div class="d-flex flex-wrap align-items-center mb-3">
      <div class="btn-group mr-2 mb-2">
        <button id="filterMinePaid" class="btn btn-outline-primary">I Paid</button>
        <button id="filterIOwe" class="btn btn-outline-secondary">I Owe</button>
      </div>

      <div class="input-group mr-2 mb-2" style="max-width:320px;">
        <div class="input-group-prepend">
          <span class="input-group-text"><i class="material-icons">search</i></span>
        </div>
        <input id="searchInput" type="text" class="form-control" placeholder="Search project">
      </div>
    </div>
    <div id="dateFilterPanel" class="card mb-3" style="display:none;">
      <div class="card-body">
        <div class="form-inline mb-2">
          <input id="datePicker" type="date" class="form-control mr-2">
          <button id="btnAddDate" class="btn btn-primary">Add</button>
          <button id="btnClearDates" class="btn btn-link ml-2">Clear all</button>
        </div>
        <div id="selectedDates" class="d-flex flex-wrap"></div>
        <small class="text-muted d-block mt-2">Select 0 date = show all.</small>
      </div>
    </div>

    <div id="billListContainer"></div>

    <div class="text-center mt-4">
      <button id="btnBackHome" class="btn btn-secondary">Back</button>
    </div>
  </div>

  <div class="modal fade" id="remindModal" tabindex="-1" role="dialog" aria-labelledby="remindModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="remindModalTitle">Reminder sent</h5></div>
        <div class="modal-body" id="remindModalBody">Reminders opened in your email/SMS app.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-dismiss="modal">Back</button>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/jquery.min.js"></script>
  <script src="scripts/popper.js"></script>
  <script src="scripts/bootstrap-material-design.js"></script>
  <script>$("body").bootstrapMaterialDesign();</script>
  <script src="/__/firebase/7.18.0/firebase-app.js"></script>
  <script src="/__/firebase/7.18.0/firebase-analytics.js"></script>
  <script src="/__/firebase/7.18.0/firebase-auth.js"></script>
  <script src="/__/firebase/7.18.0/firebase-firestore.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="scripts/rosefire.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
