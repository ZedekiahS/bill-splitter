<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=bill-splitter-1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=bill-splitter-1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Material+Icons">
  <link rel="stylesheet" href="styles/bootstrap-material-design.min.css">
  <link rel="stylesheet" href="styles/main.css">
  <title>Bill Splitter - Create Bill</title>
</head>

<body>
    <nav class="navbar navbar-dark fixed-top w-100">
    <div class="dropdown">
        <button class="btn text-light dropdown-toggle" type="button" id="hamburger" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        <i class="material-icons">menu</i>
        </button>
        <div class="dropdown-menu" aria-labelledby="hamburger">
        <a class="dropdown-item" href="/home.html">Home</a>
        <a class="dropdown-item" href="/history.html">Payment History</a>
        <a class="dropdown-item" href="/unpaid.html">Unpaid Bill</a>
        <div class="dropdown-divider"></div>
        <button id="menuSignOut" class="dropdown-item">Sign out</button>
        </div>
    </div>

    <a class="navbar-brand ml-2" href="/home.html">Bill Splitter</a>
    </nav>



  <div id="createPage" class="container page-container">
    <h4 class="mb-4">Create Bill</h4>

    <div class="form-group">
      <label class="bmd-label-floating" for="inputTitle">Project / Bill Name</label>
      <input type="text" class="form-control" id="inputTitle" placeholder="e.g., Rent July">
    </div>

    <div class="form-group">
      <label class="bmd-label-floating" for="inputDate">Date</label>
      <input type="date" class="form-control" id="inputDate">
    </div>

    <div class="form-group">
      <label class="bmd-label-floating">Payer</label>
      <input type="text" class="form-control" id="inputPayer" disabled>
    </div>

    <div class="form-group">
      <label class="bmd-label-floating" for="selectDebtors">Debtors (select 1+)</label>
      <select id="selectDebtors" class="form-control" multiple></select>
      <small class="form-text text-muted">hold Ctrl could choose multiple</small>
    </div>

    <div id="percentList" class="mb-3" style="display:none;">
      <label>Custom percentages (total up to 100%)</label>
      <div id="percentRows"></div>
      <small id="percentHint" class="form-text text-muted">Enter 0–100 for each debtor, up to 2 decimal places. The total must be above 0%; the payer covers any remainder. For example: 50 / 50 or 25 / 25.</small>
    </div>

    <div id="recRow" class="form-row">
      <div class="form-group col-md-6">
        <label class="bmd-label-floating" for="inputAmount">Amount (e.g., 120.50)</label>
        <input type="number" min="0.01" step="0.01" class="form-control" id="inputAmount" placeholder="0.00">
      </div>
      <div class="form-group col-md-6">
        <label class="bmd-label-floating">Split Type</label>
        <select id="selectSplitType" class="form-control">
          <option value="equal" selected>Equal</option>
          <option value="percent">Custom Percent</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-3">
      <button id="btnCancel" class="btn btn-secondary">Cancel</button>
      <button id="btnSave" class="btn btn-primary">Save</button>
    </div>
  </div>

  <script src="scripts/jquery.min.js"></script>
  <script src="scripts/popper.js"></script>
  <script src="scripts/bootstrap-material-design.js"></script>
  <script>$("body").bootstrapMaterialDesign();</script>
  <script src="/__/firebase/7.18.0/firebase-app.js"></script>
  <script src="/__/firebase/7.18.0/firebase-analytics.js"></script>
  <script src="/__/firebase/7.18.0/firebase-auth.js"></script>
  <script src="/__/firebase/7.18.0/firebase-firestore.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="scripts/rosefire.min.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
